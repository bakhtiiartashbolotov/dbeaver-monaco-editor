name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-dependencies-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            maven-dependencies-${{ runner.os }}-
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Cache verified DBeaver archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads/dbeaver-ce-26.1.0-linux-x86_64.tar.gz
          key: dbeaver-26.1.0-${{ hashFiles('releng/baseline/dbeaver-ce-26.1.0-linux-x86_64.tar.gz.sha256') }}
      - name: Install checksum-pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          readonly version=14.1.1
          readonly asset=ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz
          readonly url=https://github.com/BurntSushi/ripgrep/releases/download/${version}/${asset}
          readonly sha256=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          readonly install_dir=${RUNNER_TEMP}/ripgrep-${version}
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            "$url" --output "${RUNNER_TEMP}/${asset}"
          printf '%s  %s\n' "$sha256" "${RUNNER_TEMP}/${asset}" | sha256sum --check --strict -
          mkdir -p "$install_dir/bin"
          tar --extract --gzip --file "${RUNNER_TEMP}/${asset}" --directory "$install_dir"
          install -m 0755 \
            "$install_dir/ripgrep-${version}-x86_64-unknown-linux-musl/rg" \
            "$install_dir/bin/rg"
          test "$("$install_dir/bin/rg" --version | sed -n '1p')" = \
            'ripgrep 14.1.1 (rev 4649aa9700)'
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
      - run: bash scripts/verify-layout.sh
      - run: bash scripts/bootstrap-workspace.sh
      - run: ./mvnw -B clean verify
      - run: bash scripts/verify-test-target.sh
      - run: bash scripts/test-task1-guards.sh
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Upload p2 repository and baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-1-scaffold
          path: |
            repository/target/repository
            docs/evidence/task-1-baseline.md
